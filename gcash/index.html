<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay with GCash · PayUp</title>
  <meta name="description" content="Opens GCash so you can pay your share.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #FFFFFF; --text: #111111; --muted: #6F6F6F; --line: #D6D6D6; --solid: #111111; --on-solid: #FFFFFF; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; display: grid; place-items: center; min-height: 100vh;
      padding: 32px 20px calc(32px + env(safe-area-inset-bottom, 0px));
    }
    main { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { margin: 6px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }
    .btn {
      width: 100%; height: 50px; margin-top: 10px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      background: var(--solid); color: var(--on-solid); font-size: 16px; font-weight: 600; text-decoration: none;
    }
    .btn:active { opacity: .7; }
    .small { font-size: 13px; }
    .small a { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <img src="../icons/icon.svg" alt="PayUp">
    <h1>Opening GCash</h1>
    <p>In GCash, pay with the QR or mobile number you were given, then enter your amount from the message.</p>
    <a class="btn" id="open" href="gcash://">Open GCash</a>
    <p class="small">No GCash yet? Get it on the <a href="https://apps.apple.com/ph/app/gcash/id520020791">App Store</a> or <a href="https://play.google.com/store/apps/details?id=com.globe.gcash.android">Google Play</a>.</p>
  </main>
  <script>
    const android = /Android/i.test(navigator.userAgent);
    const target = android ? "intent://#Intent;scheme=gcash;package=com.globe.gcash.android;end" : "gcash://";
    document.getElementById("open").href = target;
    setTimeout(() => { location.href = target; }, 250);
  </script>
</body>
</html>

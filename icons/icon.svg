<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Canvas is 512 x 512. x goes right, y goes down. -->

  <!-- The curved right edge of the lines: a circle with the same center as the P's curve.
       r is how far the line ends reach from that center (smaller r = shorter lines). -->
  <defs>
    <clipPath id="curve">
      <circle cx="300" cy="204" r="68"/>
      <rect x="0" y="0" width="300" height="512"/>
    </clipPath>
  </defs>

  <!-- Background square (iPhone rounds the corners for you) -->
  <rect width="512" height="512" fill="#111111"/>

  <!-- Everything below is the white P. translate moves the whole P: (left/right, up/down) -->
  <g transform="translate(-26 -6)" fill="#FFFFFF">

    <!-- Stem of the P with the torn zigzag bottom -->
    <path d="M164 104 H240 V400
             L235.2 408 L230.5 400 L225.8 408 L221 400
             L216.2 408 L211.5 400 L206.8 408 L202 400
             L197.2 408 L192.5 400 L187.8 408 L183 400
             L178.2 408 L173.5 400 L168.8 408 L164 400 Z"/>

    <!-- Round part of the P: curve radius 100, from y=104 to y=304 -->
    <path d="M238 104 H300 a100 100 0 0 1 0 200 H238 Z"/>

    <!-- Five printed lines (black). Their right ends are cut by the curve above.
         x = where a line starts, y = its top, height = its thickness -->
    <g fill="#111111" clip-path="url(#curve)">
      <rect x="258" y="145.5" width="200" height="13"/>
      <rect x="258" y="171.5" width="200" height="13"/>
      <rect x="258" y="197.5" width="200" height="13"/>
      <rect x="258" y="223.5" width="200" height="13"/>
      <rect x="258" y="249.5" width="200" height="13"/>
    </g>
  </g>
</svg>

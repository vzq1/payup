<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Canvas is 512 x 512. x goes right, y goes down. -->

  <!-- Background square (iPhone rounds the corners for you) -->
  <rect width="512" height="512" fill="#111111"/>

  <!-- Top of the P (white): flat left side and top, curved right side, with a D-shaped hole.
       Outer: left x=95, top y=86, right x=417, bottom y=304. Hole: x=203 to 313, y=162 to 232. -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="M95 86 H320 A97 110 0 0 1 417 196 A322 108 0 0 1 95 304 Z
           M203 162 H278 a35 35 0 0 1 0 70 H203 Z"/>

  <!-- Leg of the P: a receipt (white) with a clean torn (zigzag) bottom. x=95 to 203, y=318 to 418 -->
  <path fill="#FFFFFF" d="M95 318 H203 V418 L196.2 425 L189.5 418 L182.8 425 L176.0 418 L169.2 425 L162.5 418 L155.8 425 L149.0 418 L142.2 425 L135.5 418 L128.8 425 L122.0 418 L115.2 425 L108.5 418 L101.8 425 L95.0 418 Z"/>

  <!-- Printed rows on the receipt (black): an item bar, a gap, then a price bar -->
  <g fill="#111111">
    <rect x="109" y="336" width="64" height="6"/>
    <rect x="179" y="336" width="10" height="6"/>
    <rect x="109" y="354" width="64" height="6"/>
    <rect x="179" y="354" width="10" height="6"/>
    <rect x="109" y="372" width="64" height="6"/>
    <rect x="179" y="372" width="10" height="6"/>
  </g>
</svg>

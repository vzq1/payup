<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Canvas is 512 x 512. x goes right, y goes down. -->

  <!-- Background square (iPhone rounds the corners for you) -->
  <rect width="512" height="512" fill="#111111"/>

  <!-- Top of the P (white): flat left side and top, one round end of radius 105 on the right.
       The hole uses the same center, so the P is 72 thick all the way around. -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="M132.5 87.5 H274.5 a105 105 0 0 1 0 210 H132.5 Z
           M204.5 159.5 H274.5 a33 33 0 0 1 0 66 H204.5 Z"/>

  <!-- Stem of the P: a receipt (white), 72 wide like the rest of the P, with a clean torn (zigzag) bottom -->
  <path fill="#FFFFFF" d="M132.5 309.5 H204.5 V417.5 L199.4 424.5 L194.2 417.5 L189.1 424.5 L183.9 417.5 L178.8 424.5 L173.6 417.5 L168.5 424.5 L163.4 417.5 L158.2 424.5 L153.1 417.5 L147.9 424.5 L142.8 417.5 L137.6 424.5 L132.5 417.5 Z"/>

  <!-- Printed rows on the receipt (black): an item bar, a gap, then a price bar -->
  <g fill="#111111">
    <rect x="143.5" y="327.5" width="36" height="6"/>
    <rect x="184.5" y="327.5" width="9" height="6"/>
    <rect x="143.5" y="344.5" width="36" height="6"/>
    <rect x="184.5" y="344.5" width="9" height="6"/>
    <rect x="143.5" y="361.5" width="36" height="6"/>
    <rect x="184.5" y="361.5" width="9" height="6"/>
  </g>
</svg>

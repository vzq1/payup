<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A strip of receipt paper folded into a P. Canvas is 512 x 512; x goes right, y goes down. -->

  <!-- Background square (iPhone rounds the corners for you) -->
  <rect width="512" height="512" fill="#111111"/>

  <!-- Back of the paper (gray): the part of the loop after the fold, going around the right side
       and under, back behind the stem. Loop center (256, 201), outer radius 112, inner radius 46. -->
  <path fill="#9E9E9E" d="M294.3 95.8 A112 112 0 1 1 144.0 201.0 L210.0 201.0 A46 46 0 1 0 271.7 157.8 Z"/>

  <!-- Front of the paper (white): the stem, 66 wide, with a torn bottom edge at y=423 -->
  <path fill="#FFFFFF" d="M144 200 H210 V423 L204.5 431 L199.0 423 L193.5 431 L188.0 423 L182.5 431 L177.0 423 L171.5 431 L166.0 423 L160.5 431 L155.0 423 L149.5 431 L144.0 423 Z"/>

  <!-- Front of the paper (white): where it curls over the top, up to the fold at 290 degrees -->
  <path fill="#FFFFFF" d="M144.0 201.0 A112 112 0 0 1 294.3 95.8 L271.7 157.8 A46 46 0 0 0 210.0 201.0 Z"/>
</svg>
